services:
  traefik:
    image: traefik:v3.1
    container_name: kiwipress-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kiwinet

  mariadb:
    image: mariadb:latest
    container_name: kiwipress-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kiwinet

  postgres:
    image: postgres:16.4
    container_name: kiwipress-postgres
    restart: always
    environment:
      POSTGRES_USER: kiwi
      POSTGRES_PASSWORD: kiwipass
      POSTGRES_DB: kiwipress
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwi -d kiwipress"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kiwinet

  minio:
    image: minio/minio:latest
    container_name: kiwipress-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kiwiadmin
      MINIO_ROOT_PASSWORD: kiwiminiosecret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-api.rule=Host(`s3.local.citrusworx.test`)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls=true
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.rule=Host(`minio.local.citrusworx.test`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    networks:
      - kiwinet

  wordpress:
    image: wordpress:latest
    container_name: kiwipress-wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_ENVIRONMENT_TYPE: staging
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://wp.local.citrusworx.test');
        define('WP_SITEURL', 'https://wp.local.citrusworx.test');
    volumes:
      - wordpress_data:/var/www/html
    labels:
      - traefik.enable=true
      - traefik.http.routers.wordpress.rule=Host(`wp.local.citrusworx.test`)
      - traefik.http.routers.wordpress.entrypoints=websecure
      - traefik.http.routers.wordpress.tls=true
      - traefik.http.services.wordpress.loadbalancer.server.port=80
    networks:
      - kiwinet

  backend:
    build: ./backend
    container_name: kiwipress-backend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_USER: kiwi
      POSTGRES_PASSWORD: kiwipass
      POSTGRES_DB: kiwipress
      WORDPRESS_API_URL: https://wp.local.citrusworx.test/wp-json/wp/v2
      MINIO_ENDPOINT: https://s3.local.citrusworx.test
      MINIO_ACCESS_KEY: kiwiadmin
      MINIO_SECRET_KEY: kiwiminiosecret
      MINIO_BUCKET: kiwipress
    depends_on:
      postgres:
        condition: service_healthy
      wordpress:
        condition: service_started
      minio:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.local.citrusworx.test`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.services.backend.loadbalancer.server.port=4000
    networks:
      - kiwinet

  frontend:
    build: ./frontend
    container_name: kiwipress-frontend
    restart: unless-stopped
    working_dir: /usr/src/app
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_API_URL: https://api.local.citrusworx.test
      VITE_WORDPRESS_API_URL: https://wp.local.citrusworx.test/wp-json/wp/v2
      VITE_MINIO_URL: https://s3.local.citrusworx.test
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`app.local.citrusworx.test`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.services.frontend.loadbalancer.server.port=5173
    networks:
      - kiwinet

networks:
  kiwinet:
    name: kiwinet
    driver: bridge

volumes:
  mariadb_data:
  postgres_data:
  minio_data:
  wordpress_data:

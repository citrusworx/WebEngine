# Path filter excludes .changeset/** so a Juice-only PR that adds a
# changeset does not run Nectarine verify.
name: Nectarine Package

on:
  pull_request:
    paths:
      - "libraries/nectarine/**"
      - ".github/workflows/nectarine-package.yml"
  push:
    branches:
      - master
      - cursor/blackwater-phase0-backend
    paths:
      - "libraries/nectarine/**"
      - ".github/workflows/nectarine-package.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cache: yarn runs yarn before later steps; Corepack must already be active.
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify Nectarine package
        run: yarn verify:nectarine

      # Changeset status is a *release* gate, not a verify gate. Juice skips
      # this step unless library sources changed; we do the same, but also
      # ignore non-publish Nectarine paths so README/docs/examples/tests-only
      # PRs (see #31) do not fail. Compare against the PR base, not master —
      # this branch is often not based on master.
      #
      # Require a changeset only for package.json, committed dist/, or src/
      # excluding tests, specs, and fixtures. verify:nectarine still runs for
      # any libraries/nectarine/** hit.
      - name: Check changeset status
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$CHANGED"
          RELEASE_CHANGED="$(
            echo "$CHANGED" | grep -E '^libraries/nectarine/(package\.json|dist/|src/)' \
              | grep -Ev '/(__fixtures__|__tests__)/|\.(test|spec)\.[^/]+$' \
              || true
          )"
          if [ -n "$RELEASE_CHANGED" ]; then
            echo "Release-relevant Nectarine paths changed:"
            echo "$RELEASE_CHANGED"
            yarn changeset status --since="origin/${{ github.base_ref }}"
          else
            echo "Skipping changeset status; no release-relevant Nectarine sources changed."
          fi

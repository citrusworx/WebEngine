name: Grapevine Package

on:
  pull_request:
    paths:
      - "libraries/grapevine/**"
      - ".github/workflows/grapevine-package.yml"
  push:
    branches:
      - master
    paths:
      - "libraries/grapevine/**"
      - ".github/workflows/grapevine-package.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Grapevine
        run: yarn workspace @citrusworx/grapevine build

      - name: Test Grapevine
        run: yarn workspace @citrusworx/grapevine test

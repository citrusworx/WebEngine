name: Juice Package

on:
  pull_request:
    paths:
      - "libraries/juice/**"
      - "libraries/sig/**"
      - ".github/workflows/juice-package.yml"
  push:
    branches:
      - master
    paths:
      - "libraries/juice/**"
      - "libraries/sig/**"
      - ".github/workflows/juice-package.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cache: yarn runs yarn before later steps; Corepack must already be active.
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify Juice package
        run: yarn verify:juice

      # Only when Juice/Sig sources changed. A Nectarine-only changeset must
      # not run (or fail) this check. Compare against the PR base, not master —
      # this branch is often not based on master.
      - name: Check changeset status
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(libraries/juice/|libraries/sig/)'; then
            yarn changeset status --since="origin/${{ github.base_ref }}"
          else
            echo "Skipping changeset status; this PR does not change Juice or Sig sources."
          fi

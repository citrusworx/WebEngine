name: KiwiPress Package

on:
  pull_request:
    paths:
      - "packages/kiwipress/**"
      - "libraries/nectarine/**"
      - "libraries/seltzer/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - "tsconfig.base.json"
      - ".github/workflows/kiwipress-package.yml"
  push:
    branches:
      - master
    paths:
      - "packages/kiwipress/**"
      - "libraries/nectarine/**"
      - "libraries/seltzer/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - "tsconfig.base.json"
      - ".github/workflows/kiwipress-package.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build KiwiPress
        run: yarn workspace @citrusworx/kiwipress build

      - name: Test KiwiPress
        run: yarn workspace @citrusworx/kiwipress test

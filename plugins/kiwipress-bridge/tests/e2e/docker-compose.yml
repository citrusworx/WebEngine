# Real WordPress for the KiwiPress bridge end-to-end test.
# Started by tests/e2e/run.sh. Not part of the app stack.
#
# Host networking: WordPress, MariaDB, and wp-cli share the host network
# namespace. The suite calls WordPress at http://127.0.0.1:18080 and the
# containers reach MariaDB at 127.0.0.1:3306. Published bridge ports are not
# used. This still works when Docker cannot forward IP between containers
# (some nested VMs drop those frames) and matches a normal localhost install.

name: kiwipress-bridge-e2e

services:
  db:
    image: mariadb:11.4
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    command:
      - --bind-address=127.0.0.1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: wordpress:php8.3-apache
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: 127.0.0.1:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Application passwords are refused over plain HTTP unless the
      # environment type is local. wp-cli reads this from wp-config.php.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'FORCE_SSL_ADMIN', false );
    volumes:
      - wp_html:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/kiwipress-bridge:ro
      - ${KIWIPRESS_E2E_APACHE_DIR:-./apache}/ports.conf:/etc/apache2/ports.conf:ro
      - ${KIWIPRESS_E2E_APACHE_DIR:-./apache}/vhost.conf:/etc/apache2/sites-enabled/000-default.conf:ro

  wpcli:
    image: wordpress:cli-php8.3
    network_mode: host
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: 127.0.0.1:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
      # wp-config.php evals this at runtime. The CLI container must set it
      # too, or application passwords stay disabled (environment type production).
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'FORCE_SSL_ADMIN', false );
    volumes:
      - wp_html:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/kiwipress-bridge:ro
    entrypoint: ["wp"]
    profiles: ["cli"]

volumes:
  wp_html:

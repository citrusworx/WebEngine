id: retro-afterburn
name: Afterburn
selector: theme="retro-afterburn"
version: 1
summary: High-energy retro-industrial theme built around charcoal, steel blue, and safety orange.

philosophy:
  role: "Identity layer for bold, mechanical, late-night interfaces."
  owns:
    - typography tone
    - color relationships
    - semantic element defaults
    - named themed surfaces
    - paint on Juice primitives (hero, card, panel, cta)
  does_not_own:
    - layout
    - spacing
    - row and stack behavior
    - container and content framing

typography:
  body:
    family: Lato
    fallback: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    tone: direct, sturdy, highly readable
    line_height: 1.6
  heading:
    family: Archivo Black
    fallback: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    tone: compressed, confident, poster-like
    weight: 900
    line_height: 1.08
    tracking: "-0.03em"

palette:
  source:
    color_1: afb-source-1
    color_2: afb-source-2
    color_3: afb-source-3
    color_4: afb-source-4
  page:
    base: afb-page
    tint: afb-page-tint
    deep: afb-deep
  text:
    default: afb-text
    muted: afb-text-muted
    soft: afb-text-soft
    inverse: afb-text-inverse
    heading: afb-heading
    ladder: soft < muted < body < heading
    inverse_note: deep ink for accent and bright surfaces; on_accent stays the button ink
  accents:
    primary: afb-accent
    secondary: afb-secondary
    soft: afb-accent-soft
    highlight: afb-highlight
    on_accent: afb-on-accent
  surfaces:
    page: afb-page charcoal floor
    muted: page mixed toward secondary and deep — quieter recess
    default: page-tint mixed toward secondary — content frost
    strong: page-tint mixed toward highlight — elevated nav and chrome
    deep: near afb-deep solid inverted band, not the light text color
    hero: afb-deep to afb-accent-strong atmospheric gradient
    card: highlight-lifted elevated gradient
    panel: quieter steel well
    cta: afb-accent to afb-accent-strong in-family gradient

semantic_elements:
  section_article_behavior: quieter muted frost, not the nav fill
  aside_behavior: default content surface
  form_behavior: default content surface
  header_behavior: quiet muted band; main > header stays type-only
  nav_behavior: stronger elevated surface, especially nav[type=bar] and nav[type=sidebar]
  footer_behavior: deep inverted band with light body ink
  div_behavior: transparent by default
  main_behavior: transparent by default

named_surfaces:
  - name: afb-card
    purpose: Elevated content card for primary modules and grouped information.
  - name: afb-panel
    purpose: Softer supporting panel for quieter informational blocks.
  - name: afb-hero
    purpose: High-contrast marquee surface for hero and lead sections.
  - name: afb-stage
    purpose: Deep presentation surface for media, products, and visual focal points.

recommended_use_cases:
  - automotive brands
  - music players
  - industrial dashboards
  - nightlife venues
  - bold editorial sites

authoring_rules:
  - Use semantic HTML for meaning first.
  - Let Juice layout primitives handle structure and responsiveness.
  - Paint Juice primitives [hero], [card], [panel], and [cta]. [afb-card], [afb-panel], [afb-hero], and [afb-stage] share those recipes and stay valid aliases.
  - Keep the ink ladder readable: soft for small, figcaption, idle tabs, and placeholders; muted for secondary card copy; body for reading text; heading for titles. Do not bind heading to deep.
  - Use inverse (deep ink) on accent and bright surfaces. Keep on-accent for primary button ink.
  - Keep surfaces stepped: page, muted, default, strong, deep. Do not paint section, nav, and footer with the same frost.
  - Use afb-hero and [hero] sparingly for the strongest section on the page.
  - Keep the four source colors recognizable while using derived tokens for accessible text and controls.
  - Keep CTA fill in-family (accent to accent-strong). Outline and secondary clear background-image.
  - Bind accordion and tabs chrome from existing surface and accent tokens so triggers stay controls, not CTA buttons.
  - Bind modal and drawer chrome from existing page and surface tokens so close actions stay surface controls.
  - Bind toast and banner status roles from existing identity tokens without introducing unrelated hue families.
  - Bind popover, tooltip, combobox, and menu chrome from existing page and surface tokens.
  - Bind switch, slider, checkbox, and radio chrome from existing surface and accent tokens.
  - Bind breadcrumb and progress chrome from existing text, border, and accent tokens.
  - Keep --juice-* aliases inside the theme contract and theme-specific --afb-* tokens as the source of truth.

example:
  root: '<body theme="retro-afterburn">'
  surfaces:
    - '<section hero>...</section>'
    - '<section afb-hero>...</section>'
    - '<article card>...</article>'
    - '<article afb-card>...</article>'
    - '<aside panel>...</aside>'
    - '<aside afb-panel>...</aside>'
    - '<section cta>...</section>'
    - '<div afb-stage>...</div>'

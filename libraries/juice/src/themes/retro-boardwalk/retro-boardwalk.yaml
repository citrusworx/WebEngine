id: retro-boardwalk
name: Boardwalk
selector: theme="retro-boardwalk"
version: 1
summary: Friendly coastal theme blending coral, sunshine yellow, mint, and ocean blue.

philosophy:
  role: "Identity layer for upbeat, accessible, coastal interfaces."
  owns:
    - typography tone
    - color relationships
    - semantic element defaults
    - named themed surfaces
  does_not_own:
    - layout
    - spacing
    - row and stack behavior
    - container and content framing

typography:
  body:
    family: Lato
    fallback: sans-serif
    tone: open, friendly, easygoing
  heading:
    family: Archivo Black
    fallback: sans-serif
    tone: rounded, lively, approachable

palette:
  source:
    color_1: bdw-source-1
    color_2: bdw-source-2
    color_3: bdw-source-3
    color_4: bdw-source-4
  page:
    base: bdw-page
    tint: bdw-page-tint
    deep: bdw-deep
  text:
    default: bdw-text
    muted: bdw-text-muted
    heading: bdw-heading
  accents:
    primary: bdw-accent
    secondary: bdw-secondary
    soft: bdw-accent-soft
    highlight: bdw-highlight
    on_accent: bdw-on-accent
  surfaces:
    default: bdw-page / bdw-page-tint translucent blend
    strong: bdw-page elevated surface
    muted: bdw-page-tint softened panel
    hero: bdw-deep to bdw-accent-strong atmospheric gradient

semantic_elements:
  default_surface_targets:
    - section
    - article
    - aside
    - nav
    - header
    - footer
    - form
  div_behavior: transparent by default
  main_behavior: transparent by default

named_surfaces:
  - name: bdw-card
    purpose: Elevated content card for primary modules and grouped information.
  - name: bdw-panel
    purpose: Softer supporting panel for quieter informational blocks.
  - name: bdw-hero
    purpose: High-contrast marquee surface for hero and lead sections.
  - name: bdw-stage
    purpose: Deep presentation surface for media, products, and visual focal points.

recommended_use_cases:
  - coastal brands
  - family entertainment
  - travel guides
  - summer campaigns
  - casual hospitality

authoring_rules:
  - Use semantic HTML for meaning first.
  - Let Juice layout primitives handle structure and responsiveness.
  - Use bdw-card and bdw-panel for supporting surfaces.
  - Use bdw-hero sparingly for the strongest section on the page.
  - Keep the four source colors recognizable while using derived tokens for accessible text and controls.
  - Bind accordion and tabs chrome from existing surface and accent tokens so triggers stay controls, not CTA buttons.
  - Bind modal and drawer chrome from existing page and surface tokens so close actions stay surface controls.
  - Bind toast and banner status roles from existing identity tokens without introducing unrelated hue families.
  - Bind popover, tooltip, combobox, and menu chrome from existing page and surface tokens.
  - Bind switch, slider, checkbox, and radio chrome from existing surface and accent tokens.
  - Bind breadcrumb and progress chrome from existing text, border, and accent tokens.
  - Bind pagination chrome from existing surface, text, and accent tokens so page controls stay surfaces, not CTA buttons.
  - Keep --juice-* aliases inside the theme contract and theme-specific --bdw-* tokens as the source of truth.

example:
  root: '<body theme="retro-boardwalk">'
  surfaces:
    - '<section bdw-hero>...</section>'
    - '<article bdw-card>...</article>'
    - '<aside bdw-panel>...</aside>'
    - '<div bdw-stage>...</div>'

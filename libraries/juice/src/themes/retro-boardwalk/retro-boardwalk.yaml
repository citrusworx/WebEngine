id: retro-boardwalk
name: Boardwalk
selector: theme="retro-boardwalk"
version: 1
summary: Friendly coastal theme blending coral, sunshine yellow, mint, and ocean blue.

philosophy:
  role: "Identity layer for upbeat, accessible, coastal interfaces."
  owns:
    - typography tone
    - color relationships
    - semantic element defaults
    - named themed surfaces
    - paint on Juice primitives (hero, card, panel, cta)
  does_not_own:
    - layout
    - spacing
    - row and stack behavior
    - container and content framing

typography:
  body:
    family: Lato
    fallback: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    tone: open, friendly, easygoing
    line_height: 1.6
  heading:
    family: Archivo Black
    fallback: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    tone: rounded, lively, approachable
    weight: 900
    line_height: 1.08
    tracking: "-0.03em"

palette:
  source:
    color_1: bdw-source-1
    color_2: bdw-source-2
    color_3: bdw-source-3
    color_4: bdw-source-4
  page:
    base: bdw-page
    tint: bdw-page-tint
    deep: bdw-deep
  text:
    default: bdw-text
    muted: bdw-text-muted
    soft: bdw-text-soft
    inverse: bdw-text-inverse
    heading: bdw-heading
    ladder: soft < muted < body < heading
    inverse_note: dark on-accent ink for solid coral CTAs; hero copy stays on the dark reading ladder; the navy footer uses page cream
  accents:
    primary: bdw-accent
    secondary: bdw-secondary
    soft: bdw-accent-soft
    highlight: bdw-highlight
    on_accent: bdw-on-accent
  surfaces:
    page: bdw-page cream floor
    muted: page-tint mixed toward deep — quieter warm recess
    default: page mixed toward secondary — mint content surface
    strong: page mixed toward highlight — elevated sunshine nav and chrome
    deep: solid bdw-deep navy inverted band, not the dark text color
    hero: cream field with corner coral, mint, and sunshine embers and dark ink
    card: highlight-lifted elevated gradient
    panel: quieter mint well
    cta: bdw-accent to bdw-accent-strong in-family gradient

semantic_elements:
  section_article_behavior: quieter muted cream, not the nav fill
  aside_behavior: default content surface
  form_behavior: default content surface
  header_behavior: quiet muted band; main > header stays type-only
  nav_behavior: stronger elevated surface, especially nav[type=bar] and nav[type=sidebar]
  footer_behavior: navy deep inverted band with light page ink
  div_behavior: transparent by default
  main_behavior: transparent by default

named_surfaces:
  - name: bdw-card
    purpose: Elevated content card for primary modules and grouped information.
  - name: bdw-panel
    purpose: Softer supporting panel for quieter informational blocks.
  - name: bdw-hero
    purpose: Cream marquee with corner embers for hero and lead sections.
  - name: bdw-stage
    purpose: Deep presentation surface for media, products, and visual focal points.

recommended_use_cases:
  - coastal brands
  - family entertainment
  - travel guides
  - summer campaigns
  - casual hospitality

authoring_rules:
  - Use semantic HTML for meaning first.
  - Let Juice layout primitives handle structure and responsiveness.
  - Paint Juice primitives [hero], [card], [panel], and [cta]. [bdw-card], [bdw-panel], [bdw-hero], and [bdw-stage] share those recipes and stay valid aliases.
  - Keep the ink ladder readable: soft for small, figcaption, idle tabs, and placeholders; muted for secondary card copy; body for reading text; heading for titles. Do not bind heading to deep.
  - Use inverse (on-accent ink) on solid coral CTAs. Keep on-accent for primary button ink. Hero copy uses the dark ladder so the cream field stays readable.
  - Keep surfaces stepped: page, muted, default, strong, deep. Do not paint section, nav, and footer with the same cream.
  - Use bdw-hero and [hero] sparingly for the strongest section on the page.
  - Keep the four source colors recognizable while using derived tokens for accessible text and controls.
  - Keep CTA fill in-family (accent to accent-strong). Outline and secondary clear background-image. Outline and idle tabs keep readable ink.
  - Bind accordion and tabs chrome from existing surface and accent tokens so triggers stay controls, not CTA buttons.
  - Bind modal and drawer chrome from existing page and surface tokens so close actions stay surface controls.
  - Bind toast and banner status roles from existing identity tokens without introducing unrelated hue families.
  - Bind popover, tooltip, combobox, and menu chrome from existing page and surface tokens.
  - Bind switch, slider, checkbox, and radio chrome from existing surface and accent tokens.
  - Bind breadcrumb and progress chrome from existing text, border, and accent tokens.
  - Keep --juice-* aliases inside the theme contract and theme-specific --bdw-* tokens as the source of truth.

example:
  root: '<body theme="retro-boardwalk">'
  surfaces:
    - '<section hero>...</section>'
    - '<section bdw-hero>...</section>'
    - '<article card>...</article>'
    - '<article bdw-card>...</article>'
    - '<aside panel>...</aside>'
    - '<aside bdw-panel>...</aside>'
    - '<section cta>...</section>'
    - '<div bdw-stage>...</div>'

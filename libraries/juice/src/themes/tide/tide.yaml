id: tide
name: Tide
selector: theme="tide"
version: 1
summary: Dark product / SaaS identity with a teal/lagoon accent. Accordion chrome uses the shared --juice-accordion-* role contract.

philosophy:
  role: "Identity layer for dark product surfaces — teal accent, not hospitality Aquaflux."
  owns:
    - typography tone
    - color relationships
    - semantic element defaults
    - named themed surfaces
    - accordion chrome role bindings
    - tabs chrome role bindings
    - drawer chrome role bindings
    - toast chrome role bindings
    - popover chrome role bindings
  does_not_own:
    - layout
    - spacing
    - row and stack behavior
    - container and content framing

typography:
  body:
    family: Inter
    fallback: sans-serif
    tone: product, readable, SaaS-first
  heading:
    family: Inter
    fallback: sans-serif
    tone: clean, confident, product-scale

palette:
  page:
    base: black-900
    tint: lagoon-800
    deep: black-900 mixed toward lagoon-900
    measure: 45rem
  text:
    default: white-200
    muted: lagoon-200
    heading: white-100
  accents:
    primary: lagoon-400 mixed toward teal-600 (cooler/deeper than teal-500)
    secondary: lagoon-400
    soft: lagoon-300
    highlight: lagoon-700
    open_wash: lagoon-500 at low alpha
    line: lagoon-500 mixed toward lagoon-700
  surfaces:
    default: black-900 translucent glass
    strong: black-900 elevated card
    muted: lagoon-800 open-hover
    card: glass FAQ stack / content card
    panel: quieter supporting well
    accordion_panel: recessed black-900 well

semantic_elements:
  default_surface_targets:
    - section
    - article
    - aside
    - nav
    - header
    - footer
    - form
  header_behavior: site headers use the default glass surface; main > header stays type-only for page intros
  nav_behavior: default glass surface; nav[type=bar] and nav[type=sidebar] use the stronger elevated fill
  div_behavior: transparent by default
  main_behavior: transparent by default

named_surfaces:
  - name: tide-card
    purpose: Elevated glass FAQ / content card for stacked product questions and compact help columns.
  - name: tide-panel
    purpose: Softer supporting well for quieter informational blocks.

recommended_use_cases:
  - dark product FAQ and help pages
  - SaaS billing and account help
  - documentation support modules
  - dashboard help drawers
  - dark product marketing and account pages
  - teal-accent SaaS shells

authoring_rules:
  - Set theme="tide" on body or a root wrapper after loading core CSS plus @citrusworx/juiceui/styles/themes/tide.
  - Use Juice layout primitives for structure; do not redefine stack or gap in the theme.
  - Group FAQ stacks in [tide-card] / [tide-panel] so [accordion] stays structural.
  - Bind accordion chrome roles (`--tide-trigger` and `--juice-accordion-*`) from Tide surface/accent tokens so `[accordion-item]` stays a surface control, not a CTA.
  - Bind drawer chrome roles (`--tide-drawer-*` and `--juice-drawer-*`) from Tide page/surface tokens so `[drawer]` stays a dark panel and `[drawer-close]` stays a surface control, not a CTA.
  - Bind toast chrome roles (`--tide-toast-*` and `--juice-toast-*`) from Tide page/surface/accent tokens so `[toast]` stays a dark panel and `[toast-close]` stays a surface control, not a CTA.
  - Bind popover chrome roles (`--tide-popover-*` and `--juice-popover-*`) from Tide page/surface tokens so `[popover-panel]` stays a dark panel and `[popover-close]` stays a surface control, not a CTA.
  - Optional chrome roles (`item-border`, `trigger-accent`, `panel`, `open-glow`) paint FAQ pill rows; other themes may omit them.
  - Keep page intros in `main > header` so they stay type, not a competing glass surface.

example:
  root: '<body theme="tide">'
  surfaces:
    - '<article tide-card>...</article>'
    - '<aside tide-panel>...</aside>'

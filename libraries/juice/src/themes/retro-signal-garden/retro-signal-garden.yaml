id: retro-signal-garden
name: Signal Garden
selector: theme="retro-signal-garden"
version: 1
summary: Graphic primary-color theme balancing signal red, butter yellow, garden green, and black.

philosophy:
  role: "Identity layer for cheerful, direct, high-recognition interfaces."
  owns:
    - typography tone
    - color relationships
    - semantic element defaults
    - named themed surfaces
  does_not_own:
    - layout
    - spacing
    - row and stack behavior
    - container and content framing

typography:
  body:
    family: Lato
    fallback: sans-serif
    tone: friendly, plainspoken, energetic
  heading:
    family: Archivo Black
    fallback: sans-serif
    tone: graphic, declarative, poster-like

palette:
  source:
    color_1: sgn-source-1
    color_2: sgn-source-2
    color_3: sgn-source-3
    color_4: sgn-source-4
  page:
    base: sgn-page
    tint: sgn-page-tint
    deep: sgn-deep
  text:
    default: sgn-text
    muted: sgn-text-muted
    heading: sgn-heading
  accents:
    primary: sgn-accent
    secondary: sgn-secondary
    soft: sgn-accent-soft
    highlight: sgn-highlight
    on_accent: sgn-on-accent
  surfaces:
    default: sgn-page / sgn-page-tint translucent blend
    strong: sgn-page elevated surface
    muted: sgn-page-tint softened panel
    hero: sgn-deep to sgn-accent-strong atmospheric gradient

semantic_elements:
  default_surface_targets:
    - section
    - article
    - aside
    - nav
    - header
    - footer
    - form
  div_behavior: transparent by default
  main_behavior: transparent by default

named_surfaces:
  - name: sgn-card
    purpose: Elevated content card for primary modules and grouped information.
  - name: sgn-panel
    purpose: Softer supporting panel for quieter informational blocks.
  - name: sgn-hero
    purpose: High-contrast marquee surface for hero and lead sections.
  - name: sgn-stage
    purpose: Deep presentation surface for media, products, and visual focal points.

recommended_use_cases:
  - food brands
  - community organizations
  - farmers markets
  - playful publications
  - family events

authoring_rules:
  - Use semantic HTML for meaning first.
  - Let Juice layout primitives handle structure and responsiveness.
  - Use sgn-card and sgn-panel for supporting surfaces.
  - Use sgn-hero sparingly for the strongest section on the page.
  - Keep the four source colors recognizable while using derived tokens for accessible text and controls.
  - Bind accordion and tabs chrome from existing surface and accent tokens so triggers stay controls, not CTA buttons.
  - Bind modal and drawer chrome from existing page and surface tokens so close actions stay surface controls.
  - Bind toast and banner status roles from existing identity tokens without introducing unrelated hue families.
  - Bind popover, tooltip, combobox, and menu chrome from existing page and surface tokens.
  - Bind switch, slider, checkbox, and radio chrome from existing surface and accent tokens.
  - Bind breadcrumb and progress chrome from existing text, border, and accent tokens.
  - Keep --juice-* aliases inside the theme contract and theme-specific --sgn-* tokens as the source of truth.

example:
  root: '<body theme="retro-signal-garden">'
  surfaces:
    - '<section sgn-hero>...</section>'
    - '<article sgn-card>...</article>'
    - '<aside sgn-panel>...</aside>'
    - '<div sgn-stage>...</div>'

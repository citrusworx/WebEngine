id: retro-orchard-club
name: Orchard Club
selector: theme="retro-orchard-club"
version: 1
summary: Organic club theme joining olive, sage, pale chartreuse, and brick red.

philosophy:
  role: "Identity layer for earthy, social, produce-inspired interfaces."
  owns:
    - typography tone
    - color relationships
    - semantic element defaults
    - named themed surfaces
  does_not_own:
    - layout
    - spacing
    - row and stack behavior
    - container and content framing

typography:
  body:
    family: Lato
    fallback: sans-serif
    tone: natural, calm, personable
  heading:
    family: Archivo Black
    fallback: sans-serif
    tone: handmade, grounded, confident

palette:
  source:
    color_1: orc-source-1
    color_2: orc-source-2
    color_3: orc-source-3
    color_4: orc-source-4
  page:
    base: orc-page
    tint: orc-page-tint
    deep: orc-deep
  text:
    default: orc-text
    muted: orc-text-muted
    heading: orc-heading
  accents:
    primary: orc-accent
    secondary: orc-secondary
    soft: orc-accent-soft
    highlight: orc-highlight
    on_accent: orc-on-accent
  surfaces:
    default: orc-page / orc-page-tint translucent blend
    strong: orc-page elevated surface
    muted: orc-page-tint softened panel
    hero: orc-deep to orc-accent-strong atmospheric gradient

semantic_elements:
  default_surface_targets:
    - section
    - article
    - aside
    - nav
    - header
    - footer
    - form
  div_behavior: transparent by default
  main_behavior: transparent by default

named_surfaces:
  - name: orc-card
    purpose: Elevated content card for primary modules and grouped information.
  - name: orc-panel
    purpose: Softer supporting panel for quieter informational blocks.
  - name: orc-hero
    purpose: High-contrast marquee surface for hero and lead sections.
  - name: orc-stage
    purpose: Deep presentation surface for media, products, and visual focal points.

recommended_use_cases:
  - food brands
  - farms and orchards
  - garden shops
  - sustainable products
  - neighborhood cafes

authoring_rules:
  - Use semantic HTML for meaning first.
  - Let Juice layout primitives handle structure and responsiveness.
  - Use orc-card and orc-panel for supporting surfaces.
  - Use orc-hero sparingly for the strongest section on the page.
  - Keep the four source colors recognizable while using derived tokens for accessible text and controls.
  - Bind accordion and tabs chrome from existing surface and accent tokens so triggers stay controls, not CTA buttons.
  - Bind modal and drawer chrome from existing page and surface tokens so close actions stay surface controls.
  - Bind toast and banner status roles from existing identity tokens without introducing unrelated hue families.
  - Bind popover, tooltip, combobox, and menu chrome from existing page and surface tokens.
  - Bind switch, slider, checkbox, and radio chrome from existing surface and accent tokens.
  - Bind breadcrumb and progress chrome from existing text, border, and accent tokens.
  - Keep --juice-* aliases inside the theme contract and theme-specific --orc-* tokens as the source of truth.

example:
  root: '<body theme="retro-orchard-club">'
  surfaces:
    - '<section orc-hero>...</section>'
    - '<article orc-card>...</article>'
    - '<aside orc-panel>...</aside>'
    - '<div orc-stage>...</div>'

id: retro-denim-dial
name: Denim Dial
selector: theme="retro-denim-dial"
version: 1
summary: Utility-minded theme layering denim blues with a focused warm-orange accent.

philosophy:
  role: "Identity layer for practical, durable, instrument-like interfaces."
  owns:
    - typography tone
    - color relationships
    - semantic element defaults
    - named themed surfaces
  does_not_own:
    - layout
    - spacing
    - row and stack behavior
    - container and content framing

typography:
  body:
    family: Lato
    fallback: sans-serif
    tone: clear, technical, dependable
  heading:
    family: Archivo Black
    fallback: sans-serif
    tone: sturdy, compact, utilitarian

palette:
  source:
    color_1: dnd-source-1
    color_2: dnd-source-2
    color_3: dnd-source-3
    color_4: dnd-source-4
  page:
    base: dnd-page
    tint: dnd-page-tint
    deep: dnd-deep
  text:
    default: dnd-text
    muted: dnd-text-muted
    heading: dnd-heading
  accents:
    primary: dnd-accent
    secondary: dnd-secondary
    soft: dnd-accent-soft
    highlight: dnd-highlight
    on_accent: dnd-on-accent
  surfaces:
    default: dnd-page / dnd-page-tint translucent blend
    strong: dnd-page elevated surface
    muted: dnd-page-tint softened panel
    hero: dnd-deep to dnd-accent-strong atmospheric gradient

semantic_elements:
  default_surface_targets:
    - section
    - article
    - aside
    - nav
    - header
    - footer
    - form
  div_behavior: transparent by default
  main_behavior: transparent by default

named_surfaces:
  - name: dnd-card
    purpose: Elevated content card for primary modules and grouped information.
  - name: dnd-panel
    purpose: Softer supporting panel for quieter informational blocks.
  - name: dnd-hero
    purpose: High-contrast marquee surface for hero and lead sections.
  - name: dnd-stage
    purpose: Deep presentation surface for media, products, and visual focal points.

recommended_use_cases:
  - workwear brands
  - automotive products
  - tools
  - technical dashboards
  - outdoor equipment

authoring_rules:
  - Use semantic HTML for meaning first.
  - Let Juice layout primitives handle structure and responsiveness.
  - Use dnd-card and dnd-panel for supporting surfaces.
  - Use dnd-hero sparingly for the strongest section on the page.
  - Keep the four source colors recognizable while using derived tokens for accessible text and controls.
  - Bind accordion and tabs chrome from existing surface and accent tokens so triggers stay controls, not CTA buttons.
  - Bind modal and drawer chrome from existing page and surface tokens so close actions stay surface controls.
  - Bind toast and banner status roles from existing identity tokens without introducing unrelated hue families.
  - Bind popover, tooltip, combobox, and menu chrome from existing page and surface tokens.
  - Bind switch, slider, checkbox, and radio chrome from existing surface and accent tokens.
  - Bind breadcrumb and progress chrome from existing text, border, and accent tokens.
  - Keep --juice-* aliases inside the theme contract and theme-specific --dnd-* tokens as the source of truth.

example:
  root: '<body theme="retro-denim-dial">'
  surfaces:
    - '<section dnd-hero>...</section>'
    - '<article dnd-card>...</article>'
    - '<aside dnd-panel>...</aside>'
    - '<div dnd-stage>...</div>'

id: retro-poolside-pop
name: Poolside Pop
selector: theme="retro-poolside-pop"
version: 1
summary: Sunny resort theme combining tomato red, orange, cream, and bright cyan.

philosophy:
  role: "Identity layer for optimistic, social, warm-weather interfaces."
  owns:
    - typography tone
    - color relationships
    - semantic element defaults
    - named themed surfaces
  does_not_own:
    - layout
    - spacing
    - row and stack behavior
    - container and content framing

typography:
  body:
    family: Lato
    fallback: sans-serif
    tone: bright, casual, welcoming
  heading:
    family: Archivo Black
    fallback: sans-serif
    tone: playful, oversized, promotional

palette:
  source:
    color_1: psp-source-1
    color_2: psp-source-2
    color_3: psp-source-3
    color_4: psp-source-4
  page:
    base: psp-page
    tint: psp-page-tint
    deep: psp-deep
  text:
    default: psp-text
    muted: psp-text-muted
    heading: psp-heading
  accents:
    primary: psp-accent
    secondary: psp-secondary
    soft: psp-accent-soft
    highlight: psp-highlight
    on_accent: psp-on-accent
  surfaces:
    default: psp-page / psp-page-tint translucent blend
    strong: psp-page elevated surface
    muted: psp-page-tint softened panel
    hero: psp-deep to psp-accent-strong atmospheric gradient

semantic_elements:
  default_surface_targets:
    - section
    - article
    - aside
    - nav
    - header
    - footer
    - form
  div_behavior: transparent by default
  main_behavior: transparent by default

named_surfaces:
  - name: psp-card
    purpose: Elevated content card for primary modules and grouped information.
  - name: psp-panel
    purpose: Softer supporting panel for quieter informational blocks.
  - name: psp-hero
    purpose: High-contrast marquee surface for hero and lead sections.
  - name: psp-stage
    purpose: Deep presentation surface for media, products, and visual focal points.

recommended_use_cases:
  - resorts
  - summer festivals
  - beverage brands
  - swimwear shops
  - travel campaigns

authoring_rules:
  - Use semantic HTML for meaning first.
  - Let Juice layout primitives handle structure and responsiveness.
  - Use psp-card and psp-panel for supporting surfaces.
  - Use psp-hero sparingly for the strongest section on the page.
  - Keep the four source colors recognizable while using derived tokens for accessible text and controls.
  - Bind accordion and tabs chrome from existing surface and accent tokens so triggers stay controls, not CTA buttons.
  - Bind modal and drawer chrome from existing page and surface tokens so close actions stay surface controls.
  - Bind toast and banner status roles from existing identity tokens without introducing unrelated hue families.
  - Bind popover, tooltip, combobox, and menu chrome from existing page and surface tokens.
  - Bind switch, slider, checkbox, and radio chrome from existing surface and accent tokens.
  - Bind breadcrumb and progress chrome from existing text, border, and accent tokens.
  - Keep --juice-* aliases inside the theme contract and theme-specific --psp-* tokens as the source of truth.

example:
  root: '<body theme="retro-poolside-pop">'
  surfaces:
    - '<section psp-hero>...</section>'
    - '<article psp-card>...</article>'
    - '<aside psp-panel>...</aside>'
    - '<div psp-stage>...</div>'

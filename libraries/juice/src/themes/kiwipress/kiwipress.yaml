id: kiwipress
name: KiwiPress
selector: theme="kiwipress"
version: 2
summary: Confident publishing theme built around fresh kiwi-green accents and warm marmalade highlights on cool slate surfaces.

philosophy:
  intent: "Identity layer for friendly, productive, SaaS-leaning publishing interfaces."
  owns:
    - typography voice
    - color relationships
    - semantic element defaults
    - paint applied to Juice component primitives
  does_not_own:
    - layout
    - spacing
    - structural primitives
    - typography scale
    - responsiveness
    - component vocabulary (Juice owns hero, card, cta, panel, modal, drawer, toast, popover, tooltip, combobox, menu, badge, stat, workflow, search-panel, tabs, plan, section-header)

typography:
  body:
    family: korolev-rounded
    fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif
    tone: clean, modern, approachable
  heading:
    family: korolev-rounded
    fallback: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif
    tone: confident, friendly, brand-forward

palette:
  page:
    base: white-100
    tint: kiwi-100
    deep: black-900
  text:
    default: slate-700
    muted: slate-600
    soft: slate-500
    heading: black-900
  accents:
    primary: kiwi-700
    primary-strong: kiwi-800
    soft: kiwi-100
    tint: kiwi-200
  warm:
    primary: marmalade-600
    soft: marmalade-100
    tint: marmalade-300
  surfaces:
    default: white-100
    muted: slate-100 quiet panel
    deep: black-900 footer / inverted bands
    hero: kiwi-100 to white-100 vertical wash
    cta: kiwi-700 to kiwi-800 diagonal gradient
    workflow: white-100 to kiwi-100 vertical wash
    pricing: white-100 to slate-100 vertical wash

semantic_elements:
  default_surface_targets:
    - section
    - article
    - aside
    - header
    - form
  nav_behavior: translucent white surface with blurred backdrop and bottom border
  footer_behavior: inverted dark surface
  div_behavior: transparent by default
  main_behavior: transparent by default

theme_modifiers:
  - attribute: warm
    applies_to: [badge, "card=feature"]
    effect: switches the accent to the marmalade warm tone instead of kiwi
  - attribute: section[type=pricing]
    effect: paints the white-to-slate vertical wash
  - attribute: section[type=workflow]
    effect: paints the white-to-kiwi vertical wash

recommended_use_cases:
  - SaaS marketing sites
  - publishing platforms
  - hosting and domain product pages
  - developer-focused product sites
  - friendly B2B landing pages

authoring_rules:
  - Use semantic HTML for meaning first.
  - Use Juice component primitives ([hero], [card], [cta], [panel], [modal], [drawer], [toast], [popover-root] / [popover-panel], [tooltip-root] / [tooltip-panel], [combobox], [menu-root] / [menu], [badge], [stat], [workflow], [search-panel], [tabs], [plan], [section-header]) — do not invent theme-specific attribute components.
  - Use Juice layout primitives (stack, row, grid, gap, container, span) and semantic spacing tokens (snug, cozy, comfortable, roomy, expansive) for structure and spacing.
  - Reserve [featured] for one [card="pricing"] per group.
  - Use [warm] as the occasional marmalade accent against the kiwi base; do not co-equal them.
  - Bind accordion chrome roles (`--kw-trigger` and `--juice-accordion-*`) from `--kw-*` surfaces/accents so `[accordion-item]` is not a kiwi CTA.
  - Bind drawer chrome roles (`--kw-drawer-*` and `--juice-drawer-*`) from `--kw-*` surfaces so `[drawer-close]` is not a kiwi CTA.
  - Bind toast chrome roles (`--kw-toast-*` and `--juice-toast-*`) from `--kw-*` surfaces/accents so `[toast-close]` is not a kiwi CTA and status remaps kiwi / cornflower / marmalade.
  - Bind popover chrome roles (`--kw-popover-*` and `--juice-popover-*`) from `--kw-*` surfaces so `[popover-close]` is not a kiwi CTA.
  - Bind wizard chrome roles (`--kw-wizard-*` and `--juice-wizard-*`) from `--kw-*` surfaces/accents so the onboarding shell, rails, and step indicators retint; product extras (logo, badge, pill, feature-icon) stay KiwiPress-local.
  - Bind tooltip chrome roles (`--kw-tooltip-*` and `--juice-tooltip-*`) from `--kw-*` surfaces so `[tooltip-panel]` retints without a new hue family. No close button.
  - Bind combobox chrome roles (`--kw-combobox-*` and `--juice-combobox-*`) from `--kw-*` surfaces so `[combobox-trigger]` is not a kiwi CTA. Not a native `<select>` restyle.
  - Bind menu chrome roles (`--kw-menu-*` and `--juice-menu-*`) from `--kw-*` surfaces so `[menu-button]` is not a kiwi CTA. APG menu button, not popover / combobox / native `<select>`.

example:
  root: '<body theme="kiwipress">'
  surfaces:
    - '<section hero>...</section>'
    - '<article card="feature">...</article>'
    - '<article card="pricing" featured>...</article>'
    - '<section cta>...</section>'
    - '<aside panel>...</aside>'

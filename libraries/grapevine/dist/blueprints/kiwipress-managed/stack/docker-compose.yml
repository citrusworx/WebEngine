name: kiwipress

services:
  traefik:
    image: traefik:v3.6
    container_name: kp-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - kiwipress_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal

  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: kp-wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}:${WORDPRESS_DB_PORT}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_URL}');
        define('WP_SITEURL', '${WP_URL}');
        define('MYSQL_CLIENT_FLAGS', MYSQLI_CLIENT_SSL);
    volumes:
      - wp_data:/var/www/html
    networks:
      - kiwipress_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.wp.rule=Host(`${WP_HOST}`)
      - traefik.http.routers.wp.entrypoints=web
      - traefik.http.services.wp.loadbalancer.server.port=80

  wp-bootstrap:
    image: wordpress:cli-php8.2
    container_name: kp-wp-bootstrap
    user: "0:0"
    depends_on:
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}:${WORDPRESS_DB_PORT}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE:-KiwiPress}
    volumes:
      - wp_data:/var/www/html
    networks:
      - kiwipress_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Waiting for WordPress files..."
        until [ -f /var/www/html/wp-config.php ]; do sleep 3; done
        if ! wp --allow-root --path=/var/www/html core is-installed 2>/dev/null; then
          wp --allow-root --path=/var/www/html core install \
            --url="$${WP_URL}" \
            --title="$${WP_TITLE}" \
            --admin_user="$${WP_ADMIN_USER}" \
            --admin_password="$${WP_ADMIN_PASSWORD}" \
            --admin_email="$${WP_ADMIN_EMAIL}" \
            --skip-email
        fi
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: kp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - kiwipress_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`${MINIO_HOST}`)
      - traefik.http.routers.minio.entrypoints=web
      - traefik.http.services.minio.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.rule=Host(`${MINIO_CONSOLE_HOST}`)
      - traefik.http.routers.minio-console.entrypoints=web
      - traefik.http.services.minio-console.loadbalancer.server.port=9001

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: kp-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    networks:
      - kiwipress_net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        tr -d '\r' < /init-buckets.sh > /tmp/init-buckets.sh
        sh /tmp/init-buckets.sh
    restart: "no"

  back:
    profiles: ["kiwipress-app"]
    image: ${KIWIPRESS_BACK_IMAGE:-nginx:alpine}
    container_name: kp-back
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_DB: ${PG_DB}
      WP_URL: ${WP_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA}
    networks:
      - kiwipress_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_HOST}`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=${PORT}

  front:
    profiles: ["kiwipress-app"]
    image: ${KIWIPRESS_FRONT_IMAGE:-nginx:alpine}
    container_name: kp-front
    restart: unless-stopped
    depends_on:
      - back
    networks:
      - kiwipress_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.front.rule=Host(`${FRONT_HOST}`)
      - traefik.http.routers.front.entrypoints=web
      - traefik.http.services.front.loadbalancer.server.port=80

networks:
  kiwipress_net:
    name: kiwipress_net

volumes:
  wp_data:
  minio_data:

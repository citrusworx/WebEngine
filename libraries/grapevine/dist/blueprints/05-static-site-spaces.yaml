# Static site on DigitalOcean Spaces + CDN (infrastructure only)
#
# For a public Vite MPA such as apps/juice (@citrusworx/juiceapp).
# This file creates the Space, a Let's Encrypt certificate, and a CDN endpoint.
# It does not build the site and it does not upload dist/.
# Use 06-juice-static.yaml when apply should run the Vite build and sync dist/.
#
# Replace the placeholder names before apply:
#   replace-space-name     DNS-style Space name, unique in your account
#   static.example.com     hostname that should serve the site
#   example.com            apex zone already delegated to DigitalOcean (Let's Encrypt)
#
# Required env (CI does not need live values; grape validate / grape plan do not call DigitalOcean):
#   DO_TOKEN
#   DO_SPACES_ACCESS_KEY_ID
#   DO_SPACES_SECRET_ACCESS_KEY   # Spaces key with All (Buckets and Objects)
#
# Let's Encrypt must be able to validate static.example.com. Apply polls the
# certificate until state is verified (override with wait: false / wait_seconds).
# A CDN entry that sends certificate_id waits even when the certificate sets
# wait: false. Apply also polls the CDN endpoint until it has a hostname when
# the create response does not include one yet.
# It does not create the CNAME from static.example.com to the CDN hostname.
# That record stays operator-owned (registrar or DigitalOcean DNS).

version: "0.1"
provider: digitalocean
region: nyc3
resources:
  domains:
    - name: example.com
  spaces:
    - name: replace-space-name
      region: nyc3
      acl: public-read
  certificates:
    - name: juice-static
      type: lets_encrypt
      dns_names:
        - static.example.com
  cdn:
    - space: replace-space-name
      region: nyc3
      ttl: 3600
      custom_domain: static.example.com
      certificate: juice-static

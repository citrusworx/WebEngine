version: "0.1"
app: webengine-nectarine-fixture
engine: KiwiEngine

database:
  default: postgres
  postgres:
    env:
      user: PG_USER
      password: PG_PASS
      host: PG_HOST
      port: PG_PORT
      database: PG_DB
  mysql:
    env:
      user: MS_USER
      password: MS_PASS
      host: MS_HOST
      port: MS_PORT
      database: MS_DB
  mongodb:
    env:
      user: MG_USER
      password: MG_PASS
      host: MG_HOST
      port: MG_PORT
      database: MG_DB

transport:
  server: seltzer

fallback:
  seed: true

resources:
  - name: product
    schema: ./schemas/product/productSchema.yml
    queries: ./schemas/product/productQueries.yml
    api: ./schemas/product/productAPI.yml

  - name: course
    schema: ./schemas/course/courseSchema.yml
    queries: ./schemas/course/courseQueries.yml
    api: ./schemas/course/courseAPI.yml

  - name: waitlist
    schema: ./schemas/waitlist/waitlistSchema.yml
    queries: ./schemas/waitlist/waitlistQueries.yml
    api: ./schemas/waitlist/waitlistAPI.yml

  - name: order
    schema: ./schemas/order/orderSchema.yml
    queries: ./schemas/order/orderQueries.yml
    api: ./schemas/order/orderAPI.yml

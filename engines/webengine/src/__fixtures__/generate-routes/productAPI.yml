# Gate 5 recipe fixture. Documents are JSON objects (JSONB-shaped).
# No database. listApiOperations flattens this file for generateRoutes.
product:
  read:
    allProducts:
      api:
        method: GET
        endpoint: /api/products
        query: allProducts

    productsByCatalog:
      api:
        method: GET
        endpoint: /api/products/catalog/:catalog
        query: payloadsByCatalog

    productById:
      api:
        method: GET
        endpoint: /api/products/:id
        query: payloadById

    countPayloads:
      api:
        method: GET
        endpoint: /api/products/count
        query: countPayloads

  create:
    newProduct:
      api:
        method: POST
        endpoint: /api/products
        query: insertPayload
        body:
          id: string.required
          name: string.required
          catalog: string

  update:
    updateProduct:
      api:
        method: PUT
        endpoint: /api/products/:id
        query: updatePayload
        body:
          name: string

  delete:
    deleteProduct:
      api:
        method: DELETE
        endpoint: /api/products/:id
        query: deleteProduct

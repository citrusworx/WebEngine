http:
  routers:
    courses-redirect:
      rule: Host(`courses.blackwatersound.local`)
      entryPoints: [web]
      middlewares: [redirect-to-www]
      service: noop@internal
      priority: 1
    gear-redirect:
      rule: Host(`gear.blackwatersound.local`)
      entryPoints: [web]
      middlewares: [redirect-to-www]
      service: noop@internal
      priority: 1
    software-redirect:
      rule: Host(`software.blackwatersound.local`)
      entryPoints: [web]
      middlewares: [redirect-to-www]
      service: noop@internal
      priority: 1
    studio-redirect:
      rule: Host(`studio.blackwatersound.local`)
      entryPoints: [web]
      middlewares: [redirect-to-www]
      service: noop@internal
      priority: 1
    songwriting-redirect:
      rule: Host(`songwriting.blackwatersound.local`)
      entryPoints: [web]
      middlewares: [redirect-to-www]
      service: noop@internal
      priority: 1
    blog-redirect:
      rule: Host(`blog.blackwatersound.local`)
      entryPoints: [web]
      middlewares: [redirect-to-www]
      service: noop@internal
      priority: 1
    apex-redirect:
      rule: Host(`blackwatersound.local`)
      entryPoints: [web]
      middlewares: [apex-to-www]
      service: noop@internal
      priority: 1

  middlewares:
    redirect-to-www:
      redirectRegex:
        regex: "^http://(?:courses|gear|software|studio|songwriting|blog)\\.blackwatersound\\.local(.*)"
        replacement: "http://www.blackwatersound.local$1"
        permanent: false
    apex-to-www:
      redirectRegex:
        regex: "^http://blackwatersound\\.local(.*)"
        replacement: "http://www.blackwatersound.local$1"
        permanent: false

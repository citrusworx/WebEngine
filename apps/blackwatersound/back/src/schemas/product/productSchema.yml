Product:
  table: products
  description: >
    Catalog items for gear and software apps. Live store is the document-store
    shape (id + payload JSONB). Relational fields are a nullable catalog
    projection used by productQueries.yml — not a replacement for JSONB.
  fields:
    id: string PRIMARY KEY
    payload: jsonb NOT NULL
    catalog: enum(gear, software)
    name: string
    slug: string UNIQUE
    sub: string
    price: string
    originalPrice: string
    img: string
    accent: string
    badge: string
    category: enum(Guitars, Cabs, Pedals, Effects, Amplifiers, Studio, Lifestyle, Accessories, DAW, Plugins, Software)
    tags: json
    blurb: text
    isNew: boolean DEFAULT false
    isActive: boolean DEFAULT true
    created_at: timestamp NOT NULL DEFAULT NOW()
    updated_at: timestamp NOT NULL DEFAULT NOW()
  relationships:
    order_items: OrderItem[]

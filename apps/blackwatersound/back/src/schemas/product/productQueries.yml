product:
  read:
    # Live DML is JSONB payload only (allPayloads / payloadById / seedPayload /
    # insertPayload / updatePayload / deleteProduct). Relational names compile
    # with quoted camelCase ("isActive") but catalog columns stay NULL.
    allProducts:
      type: SELECT
      table: products
      fields: '*'
      where: isActive = true
      orderBy: catalog, category, name

    productsByCatalog:
      type: SELECT
      table: products
      fields: '*'
      where: catalog = $1 AND isActive = true
      orderBy: category, name

    productById:
      type: SELECT
      table: products
      fields: '*'
      where: id = $1

    productBySlug:
      type: SELECT
      table: products
      fields: '*'
      where: slug = $1

    # Live document store: products(id, payload JSONB). Schema YAML owns that JSONB column.
    allPayloads:
      type: SELECT
      table: products
      fields: payload
      orderBy: created_at ASC

    payloadById:
      type: SELECT
      table: products
      fields: payload
      where: id = $1

    # JSONB path — catalog/slug live inside payload, not flattened columns.
    # Host execute still filters in TS; these names compile for a later wire-up.
    payloadsByCatalog:
      type: SELECT
      table: products
      fields: payload
      where: payload->>'catalog' = $1
      orderBy: created_at ASC

    payloadsBySlug:
      type: SELECT
      table: products
      fields: payload
      where: payload->>'slug' = $1

    payloadsContaining:
      type: SELECT
      table: products
      fields: payload
      where: payload @> $1::jsonb

    payloadsWithKey:
      type: SELECT
      table: products
      fields: payload
      where: payload ? $1

    countPayloads:
      type: SELECT
      table: products
      count: true

  create:
    newProduct:
      type: INSERT
      table: products
      fields: [id, catalog, name, slug, sub, price, originalPrice, img, accent, badge, category, tags, blurb, isNew, isActive]

    # Document-store seed. Bind a validated JSON string as $2; compiler emits $2::jsonb.
    seedPayload:
      type: INSERT
      table: products
      fields: [id, payload]
      values:
        - $1
        - { value: $2, cast: jsonb }

    # Live HTTP create. Same JSONB insert as seedPayload, plus RETURNING payload
    # so the host can unwrap the catalog document (body is the document, not
    # { payload }). Relational newProduct stays unused so columns are not flattened.
    insertPayload:
      type: INSERT
      table: products
      fields: [id, payload]
      values:
        - $1
        - { value: $2, cast: jsonb }
      returning: [payload]

  update:
    updateProduct:
      type: UPDATE
      table: products
      fields: [name, sub, price, originalPrice, img, accent, badge, category, tags, blurb, isNew, isActive, updated_at]
      where: id = $1

    # Live HTTP update. Host merges the catalog document in TS (compiler has no
    # JSONB || / jsonb_set), then replaces payload. Explicit values so WHERE
    # stays $2 (no implicit SET/$N remap). Relational updateProduct is unused.
    updatePayload:
      type: UPDATE
      table: products
      fields: [payload, updated_at]
      values:
        - { value: $1, cast: jsonb }
        - { fn: now }
      where: id = $2

  delete:
    deleteProduct:
      type: DELETE
      table: products
      where: id = $1

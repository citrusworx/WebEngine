product:
  read:
    # Live DML is JSONB payload only (allPayloads / payloadById / seedPayload).
    # Relational names compile with quoted camelCase ("isActive") but catalog
    # columns stay NULL until a later write path.
    allProducts:
      type: SELECT
      table: products
      fields: '*'
      where: isActive = true
      orderBy: catalog, category, name

    productsByCatalog:
      type: SELECT
      table: products
      fields: '*'
      where: catalog = $1 AND isActive = true
      orderBy: category, name

    productById:
      type: SELECT
      table: products
      fields: '*'
      where: id = $1

    productBySlug:
      type: SELECT
      table: products
      fields: '*'
      where: slug = $1

    # Live document store: products(id, payload JSONB). Schema YAML owns that JSONB column.
    allPayloads:
      type: SELECT
      table: products
      fields: payload
      orderBy: created_at ASC

    payloadById:
      type: SELECT
      table: products
      fields: payload
      where: id = $1

  create:
    newProduct:
      type: INSERT
      table: products
      fields: [id, catalog, name, slug, sub, price, originalPrice, img, accent, badge, category, tags, blurb, isNew, isActive]

    # Document-store seed. Bind a validated JSON string as $2; compiler emits $2::jsonb.
    seedPayload:
      type: INSERT
      table: products
      fields: [id, payload]
      values:
        - $1
        - { value: $2, cast: jsonb }

  update:
    updateProduct:
      type: UPDATE
      table: products
      fields: [name, sub, price, originalPrice, img, accent, badge, category, tags, blurb, isNew, isActive, updated_at]
      where: id = $1

  delete:
    deleteProduct:
      type: DELETE
      table: products
      where: id = $1
